{% extends "base.html" %}
{% block title %}Forgot Password | Agri Supply{% endblock %}
{% block content %}
<section class="auth-section">
  <div class="auth-card">
    <div class="auth-symbol">🌱</div>
    <span class="eyebrow">ACCOUNT RECOVERY</span>
    <h1>Forgot your password?</h1>
    <p class="muted">Enter your account email and we'll send a password reset link if it matches an active account.</p>
    <form method="POST" class="form-stack">
      <label>Email address<input type="email" name="email" required maxlength="254" autocomplete="email"></label>
      <button class="btn btn-primary btn-full" type="submit">Send Reset Link</button>
    </form>
    <p class="auth-switch"><a href="{{ url_for('login') }}">Back to login</a></p>
  </div>
</section>
{% endblock %}
