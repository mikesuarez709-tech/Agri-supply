services:
  - type: web
    name: agri-supply
    runtime: python
    plan: free
    buildCommand: pip install -r "Agri Supply/requirements.txt"
    startCommand: cd "Agri Supply" && python -m flask --app app init-db && gunicorn app:app
    healthCheckPath: /
    envVars:
      - key: DB_TYPE
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: AGRI_SECRET_KEY
        generateValue: true
