{% extends "base.html" %}
{% block title %}Verify Email | Agri Supply{% endblock %}
{% block content %}
<section class="auth-section">
  <div class="auth-card">
    <div class="auth-symbol">🌱</div>
    <span class="eyebrow">EMAIL VERIFICATION</span>
    <h1>Verify your email</h1>
    <p class="muted">Confirm this email address to activate your Agri Supply account.</p>
    <form method="POST" class="form-stack">
      <button class="btn btn-primary btn-full" type="submit">Verify Email</button>
    </form>
  </div>
</section>
{% endblock %}
