{% extends "base.html" %}
{% block title %}Reset Password | Agri Supply{% endblock %}
{% block content %}
<section class="auth-section">
  <div class="auth-card">
    <div class="auth-symbol">🌱</div>
    <span class="eyebrow">ACCOUNT RECOVERY</span>
    <h1>Set a new password</h1>
    <form method="POST" class="form-stack">
      <label>New password<div class="password-field"><input id="reset-password" type="password" name="password" required minlength="8" autocomplete="new-password"><button class="password-toggle" type="button" aria-controls="reset-password" aria-label="Show password" aria-pressed="false">Show</button></div></label>
      <label>Confirm new password<div class="password-field"><input id="reset-confirm-password" type="password" name="confirm_password" required minlength="8" autocomplete="new-password"><button class="password-toggle" type="button" aria-controls="reset-confirm-password" aria-label="Show password" aria-pressed="false">Show</button></div></label>
      <button class="btn btn-primary btn-full" type="submit">Reset Password</button>
    </form>
  </div>
</section>
{% endblock %}
