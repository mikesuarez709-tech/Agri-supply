{% extends "base.html" %}
{% block title %}Login | Agri Supply{% endblock %}
{% block content %}
<section class="auth-section"><div class="auth-card"><div class="auth-symbol">🌱</div><span class="eyebrow">WELCOME BACK</span><h1>Login to your account</h1><p class="muted">Access your Agri Supply account to continue.</p><form method="POST" class="form-stack"><label>Email address<input type="email" name="email" required maxlength="254" autocomplete="email" placeholder="you@gmail.com"></label><label>Password<div class="password-field"><input id="login-password" type="password" name="password" required autocomplete="current-password" placeholder="Enter your password"><button class="password-toggle" type="button" aria-controls="login-password" aria-label="Show password" aria-pressed="false">Show</button></div></label><button class="btn btn-primary btn-full" type="submit">Login</button></form><p class="auth-switch"><a href="{{ url_for('forgot_password') }}">Forgot your password?</a></p><p class="auth-switch"><a href="{{ url_for('resend_verification') }}">Resend verification email</a></p><p class="auth-switch">Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p></div></section>
{% endblock %}
